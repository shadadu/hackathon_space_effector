# DGM (position-only) rollout/training defaults

T: 2.0
dt: 0.02

# Joint control penalty (diag)
R_diag: [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15]

# Conservative velocity limits (rad/s)
vel_limits: [1.5, 1.5, 1.5, 1.8, 1.8, 2.0, 2.0]

# Training
iters: 4000
batch: 256
lr: 0.0003
hidden: 256
depth: 4

# Value-network backend. A PirateNet block contains three dense layers and
# starts as an identity map through its zero-initialized adaptive skip.
architecture: piratenet
pirate_blocks: 4
fourier_scale: 1.0
physics_init: true

Qp: 10.0
Qp_terminal: 80.0

device: cpu
out_path: /root/catkin_ws/src/object_tracking/models/panda_dgm_v1.pkl
model_path: /root/catkin_ws/src/object_tracking/models/panda_dgm_v1.pkl
fk_service: /compute_fk
ee_link: panda_hand
frame: world
